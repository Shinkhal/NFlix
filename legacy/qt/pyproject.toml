[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nflix-desktop"
version = "0.2.4"
description = "An unofficial Linux desktop wrapper for Netflix"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "nflix-desktop contributors" }]
keywords = ["linux", "desktop", "netflix", "qt", "pyside6"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Video",
]
dependencies = ["PySide6==6.12.0"]

[project.urls]
Homepage = "https://github.com/Shinkhal/NFlix"
Issues = "https://github.com/Shinkhal/NFlix/issues"
Source = "https://github.com/Shinkhal/NFlix"

[project.scripts]
nflix-desktop = "nflix_desktop:main"

[tool.setuptools]
py-modules = ["nflix_desktop", "app_resources"]

[tool.pyside6-project]
files = ["nflix_desktop.py", "app_resources.py"]

[tool.pyside6.deploy]
title = "nflix-desktop"
input_file = "nflix_desktop.py"
exec_directory = "dist"
icon = "assets/icon-512.png"
mode = "standalone"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
