name: Linux release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and Python headers
        run: sudo apt-get update && sudo apt-get install -y build-essential python3-dev python3-venv
      - name: Install build dependencies
        run: |
          python3 -m venv .venv-build
          .venv-build/bin/python -m pip install .
      - name: Check release tag matches project version
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "${GITHUB_REF_NAME#v}" = "$version"
      - name: Build standalone Linux bundle
        run: BUILD_VENV=.venv-build scripts/build-release.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/nflix-desktop-*-linux-x86_64.tar.gz dist/nflix-desktop-*-linux-x86_64.tar.gz.sha256 --generate-notes
