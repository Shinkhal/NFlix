name: Linux release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  linux-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm ci
      - name: Check release tag
        if: github.event_name == 'push'
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p 'require("./package.json").version')"
      - run: scripts/build-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: nflix-desktop-linux-x64
          path: release/nflix-desktop-*
          if-no-files-found: error
  publish:
    if: github.event_name == 'push'
    needs: linux-build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nflix-desktop-linux-x64
          path: release
      - name: Publish prerelease for playback validation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" release/nflix-desktop-* --prerelease --generate-notes
